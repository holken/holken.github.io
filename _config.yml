permalink: /posts/:title
markdown: kramdown
  
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

name: Simon Holk
url: https://holken.github.io
enforce_ssl: holken.github.io
description: Simon Holk — robotics researcher working on robot learning, vision-language-action models, reinforcement learning, and multimodal data quality.

collections:
  ml:
    output: true
  math:
    output: true

defaults:
  - scope:
      path: ""
      type: ml
    values:
      layout: post
  - scope:
      path: ""
      type: math
    values:
      layout: post
